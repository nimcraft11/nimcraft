<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nimcraft is a collection of projects, experiments, and creations by Nim.">
  <title>Nimcraft</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #000000;
      --surface: #030404;
      --text: #f5f8ff;
      --muted: #aab4c7;
      --blue: #56a9ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: radial-gradient(circle at 75% 35%, #10264a 0, var(--background) 38%), var(--background);
      font-family: Georgia, 'Times New Roman', serif;
    }

    .page {
      width: min(1100px, calc(100% - 40px));
      min-height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 0;
      border-bottom: 1px solid rgba(170, 190, 220, .18);
    }

    .logo {
      width: 150px;
      height: 60px;
      display: block;
      object-fit: cover;
      object-position: center;
      border-radius: 8px;
    }

    nav a {
      margin-left: 24px;
      color: var(--muted);
      font: 600 .82rem/1 Arial, sans-serif;
      text-decoration: none;
    }

    nav a:hover { color: var(--blue); }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 80px 0;
      text-align: center;
    }

    .content { max-width: 650px; }

    .eyebrow {
      margin: 0 0 22px;
      color: var(--blue);
      font: 700 .75rem/1 Arial, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 400;
      line-height: .95;
    }

    p {
      margin: 26px auto 32px;
      color: var(--muted);
      font-size: 1.15rem;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      cursor: pointer;
      padding: 14px 22px;
      border: 1px solid var(--blue);
      border-radius: 3px;
      color: #06101e;
      background: var(--blue);
      font: 700 .82rem/1 Arial, sans-serif;
      text-decoration: none;
    }

    .button:hover { background: #8bc6ff; border-color: #8bc6ff; }

    .button.secondary {
      color: var(--blue);
      background: transparent;
    }

    .button.secondary:hover {
      color: #06101e;
      background: #8bc6ff;
      border-color: #8bc6ff;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    footer {
      padding: 20px 0;
      border-top: 1px solid rgba(170, 190, 220, .18);
      color: #768197;
      font: .75rem/1.4 Arial, sans-serif;
      text-align: center;
    }

    .projects {
      margin: 0 calc((100vw - min(1100px, 100vw - 40px)) / -2);
      padding: 56px max(20px, calc((100vw - 1100px) / 2));
      color: #101827;
      background: #ffffff;
      text-align: center;
    }

    .projects[hidden] { display: none; }

    .projects h2 { margin: 0 0 12px; font-size: 2rem; font-weight: 400; }

    .projects p { margin: 0; color: #596579; font: 1rem/1.5 Arial, sans-serif; }

    .projects a { color: #1672c4; text-decoration: none; }

    .projects a:hover { text-decoration: underline; }

    @media (max-width: 520px) {
      .page { width: min(100% - 28px, 440px); }
      header { align-items: flex-start; }
      .logo { width: 125px; height: 50px; }
      nav a { margin-left: 12px; }
      nav a:first-child { display: none; }
      main { padding: 64px 0; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a href="index.html" aria-label="Nimcraft home">
        <img class="logo" src="assets/nimcraft-logo.png" alt="Nimcraft logo">
      </a>
      <nav aria-label="Main navigation">
        <a href="about.html">About me</a>
      </nav>
    </header>

    <main id="about">
      <section class="content">
        <p class="eyebrow">My projects and creations</p>
        <h1>Welcome To Nimcraft.io!</h1>
        <p>Hello! I'm the creator of Nimcraft.io. I build games from different tools to help me shape my Dreams!</p>
        <div class="actions">
          <a class="button" href="projects.html">See what I have made</a>
          <a class="button secondary" href="games.html">Games</a>
        </div>
      </section>
    </main>

    <footer>Made by Nimcraft.</footer>
  </div>
</body>
</html>
