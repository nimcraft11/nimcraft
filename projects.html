<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="canonical" href="https://nimcraft.io/projects.html">
  <meta name="description" content="Explore Nimcraft's projects and creations.">
  <title>Nimcraft | My projects</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #101829;
      --surface: #242e42;
      --text: #5db3ff;
      --muted: #5c77a0;
      --blue: #667585;
      --cyan: #21bfe3;
      --purple: #7700ff;
      --line: rgba(77, 122, 130, 0.603);
    }

    * { box-sizing: border-box; }

    html, html * { cursor: url("assets/cursor-small.png") 0 0, auto; }

    body {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      cursor: url("assets/cursor-small.png") 0 0, auto;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 20% 15%, rgba(124, 146, 255, 0.28), transparent 22%),
        radial-gradient(circle at 82% 28%, rgba(72, 210, 255, 0.18), transparent 24%),
        radial-gradient(circle at 75% 35%, rgba(76, 127, 255, 0.18) 0, rgba(5, 11, 22, 0.96) 42%),
        var(--background);
      font-family: Georgia, 'Times New Roman', serif;
    }

    .particle-layer { position: absolute; z-index: 0; inset: 0; overflow: hidden; pointer-events: none; }
    .particle { position: absolute; width: var(--size); height: var(--size); border-radius: 50%; background: #9fddff; box-shadow: 0 0 12px 3px rgba(86, 169, 255, .45); filter: brightness(1); opacity: 0; animation: particle-life var(--life) ease-in-out forwards; }
    .particle::after { content: ''; position: absolute; inset: -8px; border-radius: 50%; background: rgba(217, 244, 255, .8); filter: blur(5px); opacity: 0; animation: particle-glimmer var(--glimmer) ease-in-out var(--glimmer-delay) infinite; }
    @keyframes particle-glimmer { 0%, 100% { opacity: .2; transform: scale(.7); } 50% { opacity: var(--glimmer-opacity); transform: scale(1.25); } }
    @keyframes particle-life {
      0% { opacity: 0; transform: translate3d(0, 0, 0); }
      15% { opacity: var(--opacity); }
      85% { opacity: var(--opacity); }
      100% { opacity: 0; transform: translate3d(var(--move-x), var(--move-y), 0); }
    }

    .particle.fading { animation: particle-fade-out .6s ease-out forwards; }

    .shooting-star {
      position: absolute;
      left: var(--start-x);
      top: var(--start-y);
      width: var(--head-size, 16px);
      height: var(--head-size, 16px);
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, #d6f5ff 28%, #7ae7ff 58%, rgba(122, 231, 255, 0) 100%);
      box-shadow: 0 0 18px rgba(122, 231, 255, .95), 0 0 32px rgba(122, 231, 255, .65);
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 0 14px rgba(122, 231, 255, 0.8));
      animation: shooting-star-flight var(--duration) linear var(--delay, 0s) forwards;
      transform-origin: center;
    }

    .shooting-star::after {
      content: '';
      position: absolute;
      inset: -60%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.5), rgba(122,231,255,.18) 42%, transparent 72%);
    }

    .comet-trail-piece {
      position: absolute;
      left: var(--start-x);
      top: var(--start-y);
      width: var(--piece-width);
      height: var(--piece-height);
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(122, 231, 255, .92) 24%, rgba(236, 246, 255, .95) 68%, rgba(255, 255, 255, .7));
      box-shadow: 0 0 10px rgba(122, 231, 255, .62);
      opacity: 0;
      pointer-events: none;
      transform-origin: left center;
      animation: shooting-star-flight var(--duration) linear var(--delay) forwards;
    }

    .shooting-star.fading,
    .comet-trail-piece.fading {
      animation: shooting-star-fade .28s ease-out forwards;
    }

    @keyframes shooting-star-fade {
      to { opacity: 0; filter: blur(3px); }
    }

    @keyframes particle-fade-out {
      to { opacity: 0; transform: scale(.2); }
    }

    @keyframes shooting-star-flight {
      0% {
        left: var(--start-x);
        top: var(--start-y);
        opacity: 0;
        transform: rotate(var(--curve-angle-0)) scale(.65);
      }
      12% { opacity: var(--peak-opacity, 1); }
      12.5% { left: var(--curve-x-1); top: var(--curve-y-1); transform: rotate(var(--curve-angle-1)) scale(.75); }
      25% { left: var(--curve-x-2); top: var(--curve-y-2); transform: rotate(var(--curve-angle-2)) scale(.82); }
      37.5% { left: var(--curve-x-3); top: var(--curve-y-3); transform: rotate(var(--curve-angle-3)) scale(.9); }
      50% { left: var(--curve-x-4); top: var(--curve-y-4); opacity: var(--peak-opacity, 1); transform: rotate(var(--curve-angle-4)) scale(.94); }
      62.5% { left: var(--curve-x-5); top: var(--curve-y-5); transform: rotate(var(--curve-angle-5)) scale(.98); }
      70% { opacity: var(--peak-opacity, 1); }
      75% { left: var(--curve-x-6); top: var(--curve-y-6); transform: rotate(var(--curve-angle-6)) scale(1); }
      87.5% { left: var(--curve-x-7); top: var(--curve-y-7); transform: rotate(var(--curve-angle-7)) scale(1.04); }
      88% { opacity: var(--fade-opacity, .3); }
      100% {
        left: var(--end-x);
        top: var(--end-y);
        opacity: 0;
        transform: rotate(var(--curve-angle-8)) scale(1.08);
      }
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(900px, calc(100% - 40px));
      min-height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 22px 0;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      width: 150px;
      height: 60px;
      display: block;
      object-fit: cover;
      object-position: center;
      border-radius: 8px;
      box-shadow: 0 0 18px rgba(97, 177, 255, 0.22);
      transition: filter .2s ease, box-shadow .2s ease, transform .2s ease;
    }

    .logo:hover {
      filter: brightness(1.18);
      box-shadow: 0 0 22px rgba(122, 231, 255, 0.28);
      transform: translateY(-1px);
    }

    main {
      flex: 1;
      padding: 80px 0;
      text-align: center;
    }

    h1 {
      margin: 0 0 18px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: clamp(2.5rem, 7vw, 5rem);
      font-weight: 800;
      line-height: .9;
      letter-spacing: .08em;
      color: #00e5ff;
      text-shadow: 0 0 20px rgba(97, 177, 255, 0.38), 0 0 40px rgba(122, 231, 255, 0.28);
    }

    p { color: var(--muted); font: 1.1rem/1.6 Arial, sans-serif; }

    .intro { margin-bottom: 28px; }

    .project-card {
      max-width: 640px;
      margin: 24px auto 0;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(122, 231, 255, 0.06), rgba(97, 177, 255, 0.04));
      box-shadow: 0 0 18px rgba(97, 177, 255, 0.12);
    }

    .project-card a {
      display: block;
      padding: 22px 20px;
      color: var(--text);
      text-decoration: none;
      transition: filter .2s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease, transform .2s ease;
    }

    .project-card a:hover {
      border-color: var(--cyan);
      background: rgba(122, 231, 255, .08);
      filter: brightness(1.18);
      box-shadow: 0 0 22px rgba(122, 231, 255, 0.12);
      transform: translateY(-1px);
    }
    .project-card .tag {
      display: inline-block;
      margin-bottom: 10px;
      color: var(--cyan);
      font: 700 .72rem/1 Arial, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .project-card strong {
      display: block;
      font-size: 1.3rem;
      font-weight: 400;
    }

    a { color: var(--blue); }

    .back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 28px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--cyan);
      background: linear-gradient(135deg, rgba(122, 231, 255, 0.06), rgba(97, 177, 255, 0.04));
      box-shadow: 0 0 18px rgba(97, 177, 255, 0.12);
      font: 700 .8rem/1 Arial, sans-serif;
      text-decoration: none;
      transition: filter .2s ease, box-shadow .2s ease, border-color .2s ease, transform .2s ease, text-shadow .2s ease;
    }

    .back:hover {
      border-color: var(--cyan);
      filter: brightness(1.28);
      box-shadow: 0 0 26px rgba(122, 231, 255, 0.26);
      transform: translateY(-1px);
      text-shadow: 0 0 14px rgba(122, 231, 255, 0.58);
    }

    footer {
      padding: 20px 0;
      border-top: 1px solid var(--line);
      color: #768197;
      font: .75rem/1.4 Arial, sans-serif;
      text-align: center;
    }

    @media (max-width: 520px) {
      .page { width: min(100% - 28px, 440px); }
      main { padding: 72px 0; }
    }
  </style>
</head>
<body>
  <div class="particle-layer" aria-hidden="true"></div>
  <div class="page">
    <header>
      <a href="index.html" aria-label="Nimcraft home">
        <img class="logo" src="assets/nimcraft-logo.png" alt="Nimcraft logo">
      </a>
    </header>

    <main>
      <h1>My Projects</h1>
      <p class="intro">Explore the games and creations I have made.</p>
      <div class="project-card">
        <a href="games.html">
          <span class="tag">Games</span>
          <strong>My Games</strong>
        </a>
      </div>
      <a class="back" href="index.html">← Back to home page</a>
    </main>

    <footer>Made by Nimcraft.</footer>
  </div>
  <script>
    const particleLayer = document.querySelector('.particle-layer');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function spawnParticle() {
      if (reducedMotion) return;
      const particle = document.createElement('span');
      const life = 26;
      const size = 7 + Math.random() * 3;
      const width = Math.max(document.documentElement.clientWidth - size, 1);
      const height = Math.max(window.innerHeight - size, 1);
      const startX = Math.random() * width;
      const startY = Math.random() * height;
      const targetX = Math.random() * width;
      const targetY = Math.random() * height;
      particle.className = 'particle';
      particle.style.setProperty('--size', `${size}px`);
      particle.style.setProperty('--glimmer', `${1.5 + Math.random() * 2}s`);
      particle.style.setProperty('--glimmer-delay', `${Math.random() * 2}s`);
      particle.style.setProperty('--glimmer-opacity', `${.2 + Math.random() * .35}`);
      particle.style.left = `${startX}px`;
      particle.style.top = `${startY}px`;
      particle.style.setProperty('--life', `${life}s`);
      particle.style.setProperty('--move-x', `${targetX - startX}px`);
      particle.style.setProperty('--move-y', `${targetY - startY}px`);
      particle.style.setProperty('--opacity', `${.3 + Math.random() * .3}`);
      particle.addEventListener('animationend', () => particle.remove(), { once: true });
      particleLayer.appendChild(particle);
      if (particleTouchesText(particle)) {
        particle.remove();
        window.setTimeout(spawnParticle, 0);
      }
      startParticleCollisionChecks();
    }
    const collisionTargets = [...document.querySelectorAll('.page h1, .page h2, .page h3, .page p, .page a, .page strong, .page span:not(.particle), .page li, .page nav, .page footer, .page label, .page small')];
    function particleTouchesText(particle) {
      const particleRect = particle.getBoundingClientRect();
      return collisionTargets.some((target) => {
        const targetRect = target.getBoundingClientRect();
        return particleRect.right >= targetRect.left && particleRect.left <= targetRect.right && particleRect.bottom >= targetRect.top && particleRect.top <= targetRect.bottom;
      });
    }
    let collisionFrame = null;
    function checkParticleCollisions() {
      collisionFrame = null;
      document.querySelectorAll('.particle').forEach((particle) => {
        if (particleTouchesText(particle) && !particle.classList.contains('fading')) particle.classList.add('fading');
      });
      if (document.querySelector('.particle')) {
        collisionFrame = window.requestAnimationFrame(checkParticleCollisions);
      }
    }
    function startParticleCollisionChecks() {
      if (!collisionFrame && document.querySelector('.particle')) {
        collisionFrame = window.requestAnimationFrame(checkParticleCollisions);
      }
    }
    if (!reducedMotion) startParticleCollisionChecks();

    const cardTargets = [...document.querySelectorAll('.project-card, .feature-card, .game-card, .profile-card')];

    function rectsOverlap(a, b) {
      return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
    }

    function shootingStarHitsCard(startX, startY, endX, endY, gravity) {
      if (!cardTargets.length) return false;

      const minX = Math.min(startX, endX) - 40;
      const maxX = Math.max(startX, endX) + 40;
      let minY = startY;
      let maxY = startY;
      for (let pointIndex = 1; pointIndex <= 8; pointIndex += 1) {
        const progress = pointIndex / 8;
        const curveY = startY + (endY - startY) * progress + gravity * progress * progress;
        minY = Math.min(minY, curveY);
        maxY = Math.max(maxY, curveY);
      }
      minY -= 32;
      maxY += 32;
      const box = { left: minX, right: maxX, top: minY, bottom: maxY };

      return cardTargets.some((target) => {
        const targetRect = target.getBoundingClientRect();
        return rectsOverlap(box, targetRect);
      });
    }

    function shootingStarTouchesCard(star) {
      if (!cardTargets.length) return false;

      const starRect = star.getBoundingClientRect();
      return cardTargets.some((target) => {
        const targetRect = target.getBoundingClientRect();
        return starRect.right >= targetRect.left && starRect.left <= targetRect.right && starRect.bottom >= targetRect.top && starRect.top <= targetRect.bottom;
      });
    }

    let shootingStarFrame = null;

    function checkShootingStarCollisions() {
      shootingStarFrame = null;
      document.querySelectorAll('.shooting-star, .comet-trail-piece').forEach((star) => {
        if (shootingStarTouchesCard(star) && !star.classList.contains('fading')) {
          document.querySelectorAll(`[data-comet-id="${star.dataset.cometId}"]`).forEach((piece) => {
            if (!piece.classList.contains('fading')) {
              piece.classList.add('fading');
              piece.addEventListener('animationend', () => piece.remove(), { once: true });
            }
          });
        }
      });
      if (document.querySelector('.shooting-star, .comet-trail-piece')) {
        shootingStarFrame = window.requestAnimationFrame(checkShootingStarCollisions);
      }
    }

    function startShootingStarCollisionChecks() {
      if (!shootingStarFrame && document.querySelector('.shooting-star, .comet-trail-piece')) {
        shootingStarFrame = window.requestAnimationFrame(checkShootingStarCollisions);
      }
    }

    let cometGroupSequence = 0;

    function spawnShootingStar() {
      if (reducedMotion) return;

      let startX = 0;
      let startY = 0;
      let endX = 0;
      let endY = 0;
      let angle = 0;
      let gravity = 0;
      let attempts = 0;

      do {
        const width = window.innerWidth;
        const height = window.innerHeight;
        startX = Math.random() * Math.max(width * 0.8, 200);
        startY = Math.random() * Math.max(height * 0.65, 120);
        const travelX = 200 + Math.random() * (width * 0.65);
        const travelY = 60 + Math.random() * (height * 0.38);
        const directionX = Math.random() < 0.5 ? -1 : 1;
        const directionY = Math.random() < 0.5 ? -1 : 1;
        gravity = Math.min(110 + Math.random() * 70, height * .22);
        endX = startX + directionX * travelX;
        endY = startY + directionY * travelY;
        angle = (Math.atan2(endY - startY, endX - startX) * 180) / Math.PI;
        attempts += 1;
      } while (shootingStarHitsCard(startX, startY, endX, endY, gravity) && attempts < 24);

      if (attempts >= 24) return;

      const angleRadians = (angle * Math.PI) / 180;
      const perpendicularX = -Math.sin(angleRadians);
      const perpendicularY = Math.cos(angleRadians);
      const cometWidth = 80 + Math.random() * 140;
      const sizeRatio = (cometWidth - 80) / 140;
      const comet = {
        width: cometWidth,
        height: 2 + sizeRatio * 2,
        head: 7 + sizeRatio * 9,
        offset: 0,
        depth: Math.floor(Math.random() * 3)
      };
      const duration = `${1.4 + Math.random() * 1.6}s`;
      const cometGroupId = String(++cometGroupSequence);

      {
        const offsetX = perpendicularX * comet.offset;
        const offsetY = perpendicularY * comet.offset;
        function createPiece(className, pieceWidth, pieceHeight, opacity, delay, depthOffset) {
          const piece = document.createElement('span');
          piece.className = className;
          piece.dataset.cometId = cometGroupId;
          piece.style.setProperty('--head-size', `${comet.head}px`);
          piece.style.setProperty('--piece-width', `${pieceWidth}px`);
          piece.style.setProperty('--piece-height', `${pieceHeight}px`);
          piece.style.setProperty('--peak-opacity', String(opacity));
          piece.style.setProperty('--fade-opacity', String(opacity * .24));
          piece.style.setProperty('--delay', `${delay}s`);
          piece.style.setProperty('--duration', duration);
          piece.style.setProperty('--start-x', `${startX + offsetX}px`);
          piece.style.setProperty('--start-y', `${startY + offsetY}px`);
          piece.style.setProperty('--end-x', `${endX + offsetX}px`);
          piece.style.setProperty('--end-y', `${endY + offsetY + gravity}px`);

          for (let pointIndex = 1; pointIndex < 8; pointIndex += 1) {
            const progress = pointIndex / 8;
            const curveX = startX + (endX - startX) * progress + offsetX;
            const curveY = startY + (endY - startY) * progress + gravity * progress * progress + offsetY;
            const curveAngle = (Math.atan2(endY - startY + 2 * gravity * progress, endX - startX) * 180) / Math.PI;
            piece.style.setProperty(`--curve-x-${pointIndex}`, `${curveX}px`);
            piece.style.setProperty(`--curve-y-${pointIndex}`, `${curveY}px`);
            piece.style.setProperty(`--curve-angle-${pointIndex}`, `${curveAngle}deg`);
          }
          piece.style.setProperty('--curve-angle-0', `${angle}deg`);
          piece.style.setProperty('--curve-angle-8', `${(Math.atan2(endY - startY + 2 * gravity, endX - startX) * 180) / Math.PI}deg`);
          piece.style.zIndex = String(comet.depth * 10 + depthOffset);
          piece.addEventListener('animationend', () => piece.remove(), { once: true });
          particleLayer.appendChild(piece);
        }

        createPiece('shooting-star', 0, 0, 1, 0, 1);
        for (let trailIndex = 1; trailIndex <= 5; trailIndex += 1) {
          const pieceWidth = Math.max(7, comet.width * (.12 - trailIndex * .012));
          const pieceHeight = Math.max(1.5, comet.height * 1.5);
          const opacity = .82 - trailIndex * .11;
          createPiece('comet-trail-piece', pieceWidth, pieceHeight, opacity, trailIndex * .075, 0);
        }
      }
      startShootingStarCollisionChecks();
    }

    function scheduleParticle() {
      window.setTimeout(() => {
        for (let index = 0; index < 14; index += 1) spawnParticle();
        scheduleParticle();
      }, 3000 + Math.random() * 6000);
    }

    function scheduleShootingStar() {
      window.setTimeout(() => {
        spawnShootingStar();
        scheduleShootingStar();
      }, 2200 + Math.random() * 4200);
    }

    spawnShootingStar();
    for (let index = 0; index < 14; index += 1) spawnParticle();
    scheduleParticle();
    scheduleShootingStar();
  </script>
</body>
</html>
